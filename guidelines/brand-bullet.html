<!-- @dsCard group="Brand" viewport="700x160" subtitle="Square-in-square bullet + slot blocks" name="Bullet & slots" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--rork-lime-2);font-family:var(--font-mono);color:var(--rork-ink);}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px;display:flex;flex-direction:column;gap:6px;font-size:11px}
.chip{height:72px;border:1px solid rgba(0,0,0,.08)}</style></head><body><div style="display:flex;gap:40px;align-items:center">
<div style="display:flex;gap:20px;align-items:center"><span style="width:22px;height:22px;box-sizing:border-box;border:3px solid var(--rork-violet-2);display:grid;place-items:center"><span style="width:8px;height:8px;background:var(--rork-violet-2)"></span></span><span style="width:22px;height:22px;box-sizing:border-box;border:3px solid var(--rork-blue);display:grid;place-items:center"><span style="width:8px;height:8px;background:var(--rork-blue)"></span></span><span style="width:22px;height:22px;box-sizing:border-box;border:3px solid var(--rork-ink);display:grid;place-items:center"><span style="width:8px;height:8px;background:var(--rork-ink)"></span></span></div>
<div style="position:relative;width:240px;height:100px;overflow:hidden;background:var(--rork-lime-2)"><div style="position:absolute;left:20px;top:0;width:50px;height:40px;background:var(--rork-slot)"></div><div style="position:absolute;right:0;bottom:0;width:70px;height:36px;background:var(--rork-slot)"></div><div style="position:absolute;left:110px;bottom:0;width:50px;height:60px;background:var(--rork-slot)"></div></div>
<div style="font-size:11px;line-height:1.6">Slots #D9D9D9 bleed off<br>the canvas edge — photo crops.</div></div></body></html>
