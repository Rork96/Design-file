<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:#FCFCFC;font-family:var(--font-mono);color:var(--rork-ink);}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:120px;display:flex;flex-direction:column;gap:6px;font-size:11px}
.chip{height:72px;border:1px solid rgba(0,0,0,.08)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--rork-black)"></div><div><b>Black</b><br>--rork-black<br>#000000</div></div><div class="sw"><div class="chip" style="background:var(--rork-ink)"></div><div><b>Ink</b><br>--rork-ink<br>#1D1D1D</div></div><div class="sw"><div class="chip" style="background:var(--rork-ink-2)"></div><div><b>Frame</b><br>--rork-ink-2<br>#242424</div></div><div class="sw"><div class="chip" style="background:var(--rork-paper)"></div><div><b>Paper</b><br>--rork-paper<br>#FCFCFC</div></div><div class="sw"><div class="chip" style="background:var(--rork-slot)"></div><div><b>Slot</b><br>--rork-slot<br>#D9D9D9</div></div></div></body></html>
